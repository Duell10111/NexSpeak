# Asks every external contributor to sign CLA.md once, by commenting on their pull request.
# Signatures are committed to the `cla-signatures` branch (it must exist; it never gets merged).
# pull_request_target runs this file from the default branch and never checks out PR code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Duell10111/NexSpeak/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: Duell10111,dependabot[bot],renovate[bot],github-actions[bot]
          # Locking merged PRs breaks release-please: it comments on its merged release PR after
          # tagging and fails on a locked one (the desktop build is then skipped).
          lock-pullrequest-aftermerge: false
