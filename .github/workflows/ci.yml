# Lint, license check, typecheck, unit tests and the static web build for every push to main and every pull
# request. The E2E tests need the Docker stack (dev/docker-compose.yml) and run locally.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install input hook build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxrandr-dev libxt-dev

      - run: npm ci

      - run: npm run lint

      - name: License check
        run: npm run licenses:check -w @nexspeak/web

      - run: npm run typecheck

      - run: npm test

      - name: Build web app
        run: npm run build

  input-hook:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install input hook build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxrandr-dev libxt-dev

      - run: npm ci

      - run: npm run test:input-hook -w @nexspeak/desktop

      - name: Build the other macOS input hook architecture
        if: runner.os == 'macOS'
        run: npm run build:input-hook -w @nexspeak/desktop -- ${{ runner.arch == 'ARM64' && 'x64' || 'arm64' }}
