# Builds the desktop app for macOS, Windows and Linux. Called by release-please.yml for a release
# and by nightly.yml for a nightly (installers are attached to the release), or started by hand
# (installers only as workflow artifacts).
#
# Signing is optional and switches on with repository secrets, no workflow change needed:
# - macOS: CSC_LINK + CSC_KEY_PASSWORD (Developer ID Application certificate as base64 .p12) and
#   APPLE_API_KEY (contents of the .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER for notarization.
#   Without them the app is ad-hoc signed (runs on Apple Silicon, but Gatekeeper warns).
# - Windows: WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD. Without them SmartScreen warns.
name: Desktop

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the installers to
        type: string
        required: true
      ref:
        description: "Commit to build (default: the tag)"
        type: string
        default: ""
      channel:
        description: stable or nightly (see apps/desktop/electron-builder.cjs)
        type: string
        default: stable
      version:
        description: App version for nightly builds
        type: string
        default: ""
      repository:
        description: "Repository of the release (default: this one); nightlies need NIGHTLY_RELEASE_TOKEN"
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win --x64
          - os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build web app
        run: npm run build
        env:
          NEXT_PUBLIC_LIVEKIT_SERVICE_URL: ${{ vars.NEXT_PUBLIC_LIVEKIT_SERVICE_URL }}

      - name: Package desktop app
        working-directory: apps/desktop
        run: |
          args="${{ matrix.args }}"
          # Secrets that are not set arrive as empty strings; electron-builder would read an empty
          # CSC_LINK as the project folder ("not a file").
          for name in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || unset "$name"
          done
          if [ "$RUNNER_OS" = macOS ] && [ -z "$CSC_LINK" ]; then
            # No Developer ID: ad-hoc signature. The hardened runtime only matters for notarization
            # and would need disable-library-validation with an ad-hoc signature.
            args="$args -c.mac.identity=- -c.mac.hardenedRuntime=false"
          fi
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            # electron-builder expects the path of the .p8 key.
            export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          fi
          npm run -s build
          npx electron-builder --publish never $args
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NEXSPEAK_CHANNEL: ${{ inputs.channel }}
          NEXSPEAK_VERSION: ${{ inputs.version }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: nexspeak-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

      - name: Attach to release
        if: inputs.tag
        run: |
          shopt -s nullglob
          # The update files name the installers with dashes for spaces ("NexSpeak Nightly"); GitHub
          # would store the spaces as dots, so electron-updater could not find them.
          for file in release/*\ *; do mv "$file" "${file// /-}"; done
          gh release upload "${{ inputs.tag }}" --repo "${{ inputs.repository || github.repository }}" --clobber \
            release/*.{dmg,zip,exe,AppImage,deb,blockmap} release/latest*.yml
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ inputs.repository && secrets.NIGHTLY_RELEASE_TOKEN || github.token }}
