# Opens/updates the release PR from conventional commits on main. Merging it tags the release
# (vX.Y.Z), creates the GitHub release and then builds the desktop app for it.
# Tags pushed with GITHUB_TOKEN do not trigger other workflows, so the build is called from here.
name: Release Please

on:
  push:
    branches:
      - main

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
